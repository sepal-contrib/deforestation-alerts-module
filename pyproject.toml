[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deforestation-alerts-module"
version = "1.1.1"
description = "Forest Cover Loss Alerts analysis app for SEPAL (pysepal + Solara)."
requires-python = ">=3.10"
# Runtime dependencies are NOT declared here: sepal_environment.yml is the
# packaging authority (conda geospatial binaries + pip pins). This project
# table only makes `pip install -e .` expose the deforestation_alerts library
# package; `gui/` stays import-path-only (PYTHONPATH / conftest).
dependencies = []

[tool.setuptools.packages.find]
include = ["deforestation_alerts*"]

[tool.ruff]
line-length = 120
extend-exclude = ["js", "gui/widget/static"]

[tool.ruff.lint]
# Errors only (pyflakes + syntax): unused/undefined names, redefinitions. No
# formatter is enforced yet; style rules can be added once one is chosen.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Browser tests import their Playwright fixtures by name, which pyflakes reads
# as an unused import that each test then redefines.
"tests/test_*_browser.py" = ["F401", "F811"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so `import deforestation_alerts` / `import gui`
# work without installing the app.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "ee: live Earth Engine test (credentials + network); skipped unless DEFO_ALERTS_EE_TESTS=1 or -m ee",
]
