[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deforestation-alerts-module"
version = "1.1.1"
description = "Forest Cover Loss Alerts analysis app for SEPAL (pysepal + Solara)."
requires-python = ">=3.10"
# Runtime dependencies are NOT declared here: sepal_environment.yml is the
# packaging authority (conda geospatial binaries + pip pins). This project
# table only makes `pip install -e .` expose the deforestation_alerts library
# package; `gui/` stays import-path-only (PYTHONPATH / conftest).
dependencies = []

[tool.setuptools.packages.find]
include = ["deforestation_alerts*"]

[tool.ruff]
ignore-init-module-imports = true
fix = true
select = ["E", "F", "W", "I", "D", "RUF"]
ignore = [
    "E501", # line too long | Black takes care of it
    "D101", # Missing docstring in public class | set it in __init__
]

# init file are here to hide the internal structure to the user of the lib
exclude = ["*/__init__.py"]

[tool.ruff.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"*/__init__.py" = ["F403"] # unable to detect undefined names | hide internal structure

[tool.codespell]
skip = 'deforestation_alerts/message/**/*.json'

[tool.pytest.ini_options]
# Put the repo root on sys.path so `import deforestation_alerts` / `import gui`
# work without installing the app.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "ee: live Earth Engine test (credentials + network); skipped unless DEFO_ALERTS_EE_TESTS=1 or -m ee",
]
