services:
  app:
    build:
      context: .
      dockerfile: gui/Dockerfile
    ports:
      - "8900:8900"
    # SEPAL's app-launcher provides these in production; for local runs mount
    # your EE credentials. User files are NOT written to the container: they go
    # to the user's SEPAL workspace through the session SepalClient
    # (deforestation_alerts/scripts/workspace.py), so there is no data-dir env
    # var. DEFORESTATION_ALERTS_GDAL_TMPDIR can redirect container-local scratch.
    volumes:
      - ~/.config/earthengine:/root/.config/earthengine:ro
