name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ruff
        run: pipx run ruff==0.12.0 check .

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: sepal_environment.yml
          cache-environment: true

      - name: Verify ee-api fork
        shell: micromamba-shell {0}
        run: |
          python -c "import ee; v=ee.__version__; print('ee-api:', v); assert v == '1.6.14', 'Expected openforis fork 1.6.14, got ' + v"


      # The offline tier only: the live Earth Engine tests (marked `ee`) skip
      # unless DEFO_ALERTS_EE_TESTS=1 is set, which this job does not set.
      - name: Run unit tests
        shell: micromamba-shell {0}
        run: |
          pip install pytest
          pytest tests/ -v

      - name: Solara app compile + import
        shell: micromamba-shell {0}
        run: |
          python -m compileall -q gui deforestation_alerts
          python -c "import gui.solara_app; print('solara app import ok')"
